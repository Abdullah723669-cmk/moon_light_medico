version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: moon_light_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: moon_light_medico
      MYSQL_USER: moonlight_user
      MYSQL_PASSWORD: moonlight_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./moon_light_medico.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmy-secret-pw"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: moon_light_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_USER=moonlight_user
      - DB_PASSWORD=moonlight_password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=moon_light_medico
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AIzaSyBF0POdEBws2FUS29jMYhhDb63m_vmi-_E}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: moon_light_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  backend_uploads:
